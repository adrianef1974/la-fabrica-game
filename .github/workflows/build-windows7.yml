name: Compilar LA FABRICA para Windows 7

on:
  workflow_dispatch:
  push:
    branches:
      - exe-windows7-v7
    paths:
      - "LA_FABRICA_SIMULADOR_COMPLETO_v7.py"
      - ".github/workflows/build-windows7.yml"

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Preparar Python compatible con Windows 7
        uses: actions/setup-python@v5
        with:
          python-version: "3.8.10"

      - name: Instalar dependencias compatibles
        run: |
          python -m pip install --upgrade "pip<25"
          python -m pip install "pygame==2.1.3" "pyinstaller==3.6"

      - name: Comprobar sintaxis
        run: python -m py_compile LA_FABRICA_SIMULADOR_COMPLETO_v7.py

      - name: Crear ejecutable
        run: >
          python -m PyInstaller
          --noconfirm
          --clean
          --onefile
          --windowed
          --name LA_FABRICA
          LA_FABRICA_SIMULADOR_COMPLETO_v7.py

      - name: Publicar ejecutable
        uses: actions/upload-artifact@v4
        with:
          name: LA_FABRICA_Windows7_x64
          path: dist/LA_FABRICA.exe
          if-no-files-found: error
